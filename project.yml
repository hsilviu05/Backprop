# Generate the Xcode project with: xcodegen generate
# (brew install xcodegen). The generated Backprop.xcodeproj is not committed.
name: Backprop
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Keeps Xcode from asking to "Update to recommended settings".
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.102.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Xcode's recommended project settings.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Backprop:
    type: application
    platform: iOS
    sources:
      - path: Backprop
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BACKPROP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(BACKPROP_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Xcode's orientation check (General > Deployment Info) reads these build
        # settings, not Info.plist. Same values as the Info.plist keys below.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Backprop/Resources/Info.plist
      properties:
        CFBundleDisplayName: Backprop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Xcode's orientation check looks at the iPad key even for an iPhone-only target.
        # Declaring all four here satisfies it; the app itself stays portrait on iPhone.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Portrait-only is intentional, so declare the app as full screen.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        BackpropTermsURL: $(BACKPROP_TERMS_URL)
        BackpropPrivacyURL: $(BACKPROP_PRIVACY_URL)
  BackpropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BackpropTests
    dependencies:
      - target: Backprop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BACKPROP_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(BACKPROP_TEAM_ID)
schemes:
  Backprop:
    build:
      targets:
        Backprop: all
        BackpropTests: [test]
    test:
      targets: [BackpropTests]
