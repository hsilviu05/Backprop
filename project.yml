# Generate the Xcode project with: xcodegen generate
# (brew install xcodegen). The generated Backprop.xcodeproj is not committed.
name: Backprop
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.102.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Backprop:
    type: application
    platform: iOS
    sources:
      - path: Backprop
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BACKPROP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(BACKPROP_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Backprop/Resources/Info.plist
      properties:
        CFBundleDisplayName: Backprop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPhone-only, portrait-only app: opt out of the "all orientations" requirement.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        BackpropTermsURL: $(BACKPROP_TERMS_URL)
        BackpropPrivacyURL: $(BACKPROP_PRIVACY_URL)
  BackpropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BackpropTests
    dependencies:
      - target: Backprop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BACKPROP_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(BACKPROP_TEAM_ID)
schemes:
  Backprop:
    build:
      targets:
        Backprop: all
        BackpropTests: [test]
    test:
      targets: [BackpropTests]
